<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Openings Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #232220;
    --border: #2e2c29;
    --gold: #c9a84c;
    --gold-light: #e2c06e;
    --cream: #f0e6d3;
    --cream-dim: #9c8f7a;
    --white-sq: #e8d5b0;
    --black-sq: #8b6343;
    --white-piece: #f5edd8;
    --black-piece: #1a1410;
    --highlight: rgba(201,168,76,0.35);
    --hint: rgba(80,200,100,0.6);
    --wrong: rgba(220,60,60,0.6);
    --text: #f0e6d3;
    --muted: #7a7060;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold);
    letter-spacing: 0.02em;
  }

  .mode-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .mode-btn {
    padding: 7px 20px;
    background: transparent;
    color: var(--cream-dim);
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    transition: all 0.2s;
  }

  .mode-btn.active {
    background: var(--gold);
    color: var(--bg);
    font-weight: 500;
  }

  .main {
    display: grid;
    grid-template-columns: 260px 1fr 280px;
    gap: 0;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT PANEL */
  .openings-list {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 1rem 0;
  }

  .list-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    padding: 0 1.25rem 0.75rem;
    text-transform: uppercase;
  }

  .opening-item {
    padding: 0.75rem 1.25rem;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
  }

  .opening-item:hover {
    background: var(--surface);
  }

  .opening-item.active {
    border-left-color: var(--gold);
    background: var(--surface);
  }

  .opening-name {
    font-size: 14px;
    color: var(--cream);
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }

  .opening-progress {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .opening-progress.good { color: var(--gold); }
  .opening-progress.mastered { color: #70d080; }

  .opening-item.active .opening-name {
    color: var(--gold-light);
  }

  .opening-meta {
    font-size: 11px;
    color: var(--cream-dim);
    font-family: 'DM Mono', monospace;
  }

  .tag {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 10px;
    margin-right: 4px;
    letter-spacing: 0.04em;
  }

  .tag-aggressive { background: rgba(200,80,60,0.2); color: #e07060; }
  .tag-solid { background: rgba(60,120,200,0.2); color: #6090d0; }
  .tag-positional { background: rgba(60,160,100,0.2); color: #60b070; }
  .tag-dynamic { background: rgba(200,160,60,0.2); color: var(--gold); }

  /* CENTER */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 1.5rem 2rem;
    gap: 1.5rem;
  }

  .board-wrap {
    position: relative;
  }

  .board-labels-file {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    width: 400px;
    padding: 0 0 4px 0;
  }

  .board-labels-rank {
    position: absolute;
    left: -18px;
    top: 0;
    display: flex;
    flex-direction: column;
    height: 400px;
  }

  .board-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--cream-dim);
    text-align: center;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #board {
    width: 400px;
    height: 400px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 2px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .sq {
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-family: 'Apple Symbols', 'Segoe UI Symbol', 'Noto Sans Symbols 2', sans-serif;
    cursor: default;
    transition: background 0.15s;
    position: relative;
    user-select: none;
  }

  .sq.light { background: var(--white-sq); }
  .sq.dark  { background: var(--black-sq); }
  .sq.highlighted { background: var(--highlight) !important; }
  .sq.hint-sq { background: var(--hint) !important; }
  .sq.wrong-sq { background: var(--wrong) !important; }
  .sq.clickable { cursor: pointer; }
  .sq.clickable:hover { filter: brightness(1.15); }

  /* Move controls */
  .move-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-btn {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--cream);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .ctrl-btn:hover:not(:disabled) {
    border-color: var(--gold);
    color: var(--gold);
  }

  .ctrl-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .move-counter {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    min-width: 80px;
    text-align: center;
  }

  /* Notation strip */
  .notation-strip {
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
    max-width: 400px;
    overflow-x: auto;
    justify-content: flex-start;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .notation-strip::-webkit-scrollbar { display: none; }

  .notation-pill {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--cream-dim);
    background: var(--surface);
    transition: all 0.15s;
  }

  .notation-pill.current {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.1);
  }

  .notation-pill.past {
    color: var(--cream-dim);
  }

  /* RIGHT PANEL */
  .info-panel {
    border-left: 1px solid var(--border);
    padding: 1.5rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .opening-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--cream);
    line-height: 1.3;
  }

  .opening-desc {
    font-size: 13px;
    color: var(--cream-dim);
    line-height: 1.7;
  }

  .move-explanation {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }

  .move-exp-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .move-exp-move {
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    color: var(--gold);
    margin-bottom: 0.5rem;
    font-weight: 500;
  }

  .move-exp-text {
    font-size: 13px;
    color: var(--cream-dim);
    line-height: 1.7;
  }

  .strategy-block {
    background: var(--surface2);
    border-radius: 8px;
    padding: 1rem;
  }

  .strategy-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .strategy-point {
    display: flex;
    gap: 8px;
    margin-bottom: 0.6rem;
    font-size: 12px;
    color: var(--cream-dim);
    line-height: 1.5;
  }

  .strategy-point::before {
    content: '◆';
    color: var(--gold);
    font-size: 8px;
    margin-top: 4px;
    flex-shrink: 0;
  }

  /* QUIZ */
  .quiz-prompt {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    font-size: 13px;
    color: var(--cream-dim);
    line-height: 1.6;
  }

  .quiz-prompt strong {
    color: var(--gold);
    display: block;
    margin-bottom: 0.4rem;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .quiz-feedback {
    border-radius: 8px;
    display: none;
  }

  .quiz-feedback.correct {
    background: rgba(60,160,80,0.18);
    border: 1px solid rgba(60,160,80,0.5);
    display: block;
    padding: 1rem;
  }

  .quiz-feedback.wrong {
    background: rgba(200,60,60,0.18);
    border: 1px solid rgba(200,60,60,0.5);
    display: block;
    padding: 1rem;
  }

  .quiz-verdict {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .quiz-feedback.correct .quiz-verdict { color: #7dd880; }
  .quiz-feedback.wrong  .quiz-verdict { color: #e07070; }

  .quiz-explanation {
    font-size: 13px;
    color: var(--cream-dim);
    line-height: 1.65;
  }
  .quiz-explanation strong { color: var(--gold); }

  @keyframes quizBtnPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.55); }
    55%       { box-shadow: 0 0 0 7px rgba(201,168,76,0); }
  }

  .quiz-btn {
    width: 100%;
    padding: 10px;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }

  .quiz-btn:hover { background: var(--gold-light); }
  .quiz-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .quiz-btn.ready { animation: quizBtnPulse 1.4s ease-in-out infinite; }

  .score-display {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 0.5rem;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.25s ease; }

  /* ── MOBILE (≤ 767px) ─────────────────────────────────────────────────── */
  @media (max-width: 767px) {
    :root {
      /* board scales to viewport, capped at the desktop 400px */
      --bsz: min(400px, calc(100vw - 56px));
    }

    header {
      padding: 0.875rem 1rem;
    }
    .mode-btn {
      padding: 9px 14px;
    }

    /* ── Layout: vertical stack ── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    /* ── Openings list → horizontal scrollable strip at top ── */
    .openings-list {
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .openings-list::-webkit-scrollbar { display: none; }

    .list-label { display: none; }

    #openings-list-items {
      display: flex;
      flex-direction: row;
      padding: 0.5rem;
      gap: 0.4rem;
      width: max-content;
    }

    .opening-item {
      flex-shrink: 0;
      width: 140px;
      border-left: none;
      border-bottom: 2px solid transparent;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      min-height: 56px;
    }
    .opening-item.active {
      border-left-color: transparent;
      border-bottom-color: var(--gold);
    }
    .opening-item.active .opening-name {
      color: var(--gold-light);
    }

    /* ── Board: scale to fit screen width ── */
    .center {
      padding: 1rem;
      gap: 1rem;
      align-items: flex-start;
    }

    /* shift board-wrap right so rank labels (at left: -18px) stay visible */
    .board-wrap {
      margin-left: 20px;
    }

    #board {
      width: var(--bsz);
      height: var(--bsz);
    }

    .sq {
      width: calc(var(--bsz) / 8);
      height: calc(var(--bsz) / 8);
      font-size: calc(var(--bsz) / 10);
    }

    .board-labels-file {
      width: var(--bsz);
    }

    .board-labels-rank {
      height: var(--bsz);
    }

    .notation-strip {
      max-width: var(--bsz);
      margin-left: 20px;
    }

    /* ── Controls: larger tap targets ── */
    .ctrl-btn {
      width: 48px;
      height: 48px;
      font-size: 22px;
    }

    /* ── Info panel: below board, full width ── */
    .info-panel {
      border-left: none;
      border-top: 1px solid var(--border);
      overflow-y: visible;
      padding: 1.25rem 1rem;
    }

    /* ── Quiz buttons: bigger tap targets ── */
    .quiz-btn {
      padding: 14px;
      font-size: 15px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo">♟ Openings Lab</div>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('browse')">Browse</button>
    <button class="mode-btn" onclick="setMode('quiz')">Quiz</button>
  </div>
</header>

<div class="main">
  <!-- LEFT: openings list -->
  <div class="openings-list">
    <div class="list-label">Openings</div>
    <div id="openings-list-items"></div>
  </div>

  <!-- CENTER: board -->
  <div class="center">
    <div class="board-wrap">
      <div class="board-labels-rank" id="rank-labels"></div>
      <div id="board"></div>
      <div class="board-labels-file" id="file-labels"></div>
    </div>

    <div class="notation-strip" id="notation-strip"></div>

    <div class="move-controls">
      <button class="ctrl-btn" id="btn-prev" onclick="prevMove()" title="Previous move">‹</button>
      <div class="move-counter" id="move-counter">Start</div>
      <button class="ctrl-btn" id="btn-next" onclick="nextMove()" title="Next move">›</button>
    </div>
  </div>

  <!-- RIGHT: info -->
  <div class="info-panel" id="info-panel"></div>
</div>

function loadProgress() {
  try { progress = JSON.parse(localStorage.getItem('chess-openings-progress') || '{}'); }
  catch(e) { progress = {}; }
}

function saveProgress(openingId, score, total) {
  const prev = progress[openingId];
  progress[openingId] = {
    attempts: (prev?.attempts || 0) + 1,
    bestScore: Math.max(prev?.bestScore ?? -1, score),
    total,
  };
  localStorage.setItem('chess-openings-progress', JSON.stringify(progress));
  renderOpeningsList(currentOpening.id);
}

function init() {
  loadProgress();
  renderOpeningsList();
  buildBoardDOM();
  loadOpening(OPENINGS[0]);
}

function renderOpeningsList(activeId = OPENINGS[0].id) {
  const el = document.getElementById('openings-list-items');
  el.innerHTML = OPENINGS.map((o,i) => {
    const p = progress[o.id];
    let progressHtml = '';
    if (p) {
      const pct = Math.round(p.bestScore / p.total * 100);
      const cls = pct === 100 ? 'mastered' : pct >= 80 ? 'good' : '';
      progressHtml = `<span class="opening-progress ${cls}">${pct === 100 ? '✓ ' : ''}${p.bestScore}/${p.total}</span>`;
    }
    return `
    <div class="opening-item${o.id === activeId ? ' active' : ''}" onclick="loadOpening(OPENINGS[${i}])" id="item-${o.id}">
      <div class="opening-name"><span>${o.name}</span>${progressHtml}</div>
      <div class="opening-meta">
        <span class="tag tag-${o.style}">${o.style}</span>
        <span>${o.firstMoves}</span>
      </div>
    </div>`;
  }).join('');
}

  const board = document.getElementById('board');

  for (let r = 8; r >= 1; r--) {
    for (let c = 0; c < 8; c++) {
      const file = 'abcdefgh'[c];
      const sq = document.createElement('div');
      sq.className = `sq ${(r+c)%2===0?'dark':'light'}`;
      sq.id = `sq-${file}${r}`;
      sq.onclick = () => handleSquareClick(file+r);
      board.appendChild(sq);
    }
  }

  // rank labels
  const ranks = document.getElementById('rank-labels');
  ranks.innerHTML = '';
  for (let r = 8; r >= 1; r--) {
    const l = document.createElement('div');
    l.className = 'board-label';
    l.textContent = r;
    ranks.appendChild(l);
  }

  // file labels
  const files = document.getElementById('file-labels');
  files.innerHTML = '';
  for (const f of 'abcdefgh') {
    const l = document.createElement('div');
    l.className = 'board-label';
    l.textContent = f;
    files.appendChild(l);
  }
}

// ── OPENING LOAD ─────────────────────────────────────────────────────────────
function loadOpening(opening) {
  currentOpening = opening;
  currentMoveIdx = 0;
  boardState = {...INIT_POSITION};

  document.querySelectorAll('.opening-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`item-${opening.id}`).classList.add('active');

  renderBoard();
  renderNotation();
  renderInfo();
  updateControls();

  if (mode === 'quiz') startQuiz();
}

// ── BOARD RENDER ──────────────────────────────────────────────────────────────
function renderBoard(highlightFrom=null, highlightTo=null) {
  for (let r = 1; r <= 8; r++) {
    for (const f of 'abcdefgh') {
      const key = f+r;
      const sq = document.getElementById(`sq-${key}`);
      if (!sq) continue;
      const piece = boardState[key];
      sq.textContent = piece ? (WHITE_TO_FILLED[piece] || piece) + '︎' : '';
      sq.classList.remove('highlighted','hint-sq','wrong-sq','clickable');

      if (piece) {
        sq.style.color = WHITE_PIECES.has(piece) ? '#fff8ec' : '#1a1410';
        sq.style.textShadow = WHITE_PIECES.has(piece)
          ? 'none'
          : '0 1px 2px rgba(255,255,255,0.15)';
      } else {
        sq.style.color = '';
        sq.style.textShadow = '';
      }
    }
  }
  if (highlightFrom) document.getElementById(`sq-${highlightFrom}`)?.classList.add('highlighted');
  if (highlightTo)   document.getElementById(`sq-${highlightTo}`)?.classList.add('highlighted');
}

// ── MOVES ────────────────────────────────────────────────────────────────────
function applyMove(move) {
  if (!move.from || !move.to) return;
  boardState[move.to] = boardState[move.from];
  delete boardState[move.from];
}

function undoMove(move) {
  if (!move.from || !move.to) return;
  boardState[move.from] = boardState[move.to];
  delete boardState[move.to];
}

function nextMove() {
  if (currentMoveIdx >= currentOpening.moves.length - 1) return;
  currentMoveIdx++;
  const move = currentOpening.moves[currentMoveIdx];
  applyMove(move);
  renderBoard(move.from, move.to);
  renderNotation();
  renderInfo();
  updateControls();
}

function prevMove() {
  if (currentMoveIdx <= 0) return;
  const move = currentOpening.moves[currentMoveIdx];
  undoMove(move);
  currentMoveIdx--;
  const prev = currentOpening.moves[currentMoveIdx];
  renderBoard(prev.from, prev.to);
  renderNotation();
  renderInfo();
  updateControls();
}

function updateControls() {
  document.getElementById('btn-prev').disabled = currentMoveIdx === 0;
  document.getElementById('btn-next').disabled = currentMoveIdx === currentOpening.moves.length - 1;
  const total = currentOpening.moves.length - 1;
  document.getElementById('move-counter').textContent =
    currentMoveIdx === 0 ? 'Start' : `Move ${currentMoveIdx} / ${total}`;
}

// ── NOTATION ─────────────────────────────────────────────────────────────────
function renderNotation() {
  const strip = document.getElementById('notation-strip');
  strip.innerHTML = currentOpening.moves.map((m, i) => {
    if (i === 0) return '';
    const cls = i < currentMoveIdx ? 'past' : i === currentMoveIdx ? 'current' : '';
    return `<span class="notation-pill ${cls}">${m.notation}</span>`;
  }).join('');
  const current = strip.querySelector('.current');
  if (current) current.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

// ── INFO PANEL ───────────────────────────────────────────────────────────────
function renderInfo() {
  const panel = document.getElementById('info-panel');
  const move = currentOpening.moves[currentMoveIdx];

  if (mode === 'browse') {
    panel.innerHTML = `
      <div class="fade-in">
        <div class="opening-title">${currentOpening.name}</div>
        <span class="tag tag-${currentOpening.style}">${currentOpening.style}</span>
      </div>
      <p class="opening-desc fade-in">${currentOpening.desc}</p>
      <hr class="divider">
      <div class="move-explanation fade-in">
        <div class="move-exp-label">Current move</div>
        <div class="move-exp-move">${move.notation}</div>
        <div class="move-exp-text">${move.explanation}</div>
      </div>
      <div class="strategy-block fade-in">
        <div class="strategy-label">Key ideas</div>
        ${currentOpening.strategy.map(s => `<div class="strategy-point">${s}</div>`).join('')}
      </div>
    `;
  } else {
    renderQuizPanel();
  }
}

// ── QUIZ ──────────────────────────────────────────────────────────────────────
function startQuiz() {
  boardState = {...INIT_POSITION};
  currentMoveIdx = 0;
  quizState.waitingForClick = false;
  quizState.quizMoveIdx = 1;
  quizState.score = 0;
  quizState.total = 0;
  renderBoard();
  renderNotation();
  updateControls();
  renderQuizPanel();
  promptNextQuizMove();
}

function promptNextQuizMove() {
  if (quizState.quizMoveIdx >= currentOpening.moves.length) {
    renderQuizComplete(); return;
  }
  const move = currentOpening.moves[quizState.quizMoveIdx];
  quizState.expectedTo = move.to;
  quizState.waitingForClick = true;
  renderQuizPanel();

  // show hint: highlight from-square
  if (move.from) {
    document.getElementById(`sq-${move.from}`)?.classList.add('hint-sq');
  }
}

function handleSquareClick(sq) {
  if (mode !== 'quiz' || !quizState.waitingForClick) return;
  const move = currentOpening.moves[quizState.quizMoveIdx];
  quizState.waitingForClick = false;
  quizState.total++;

  document.querySelectorAll('.sq').forEach(s => s.classList.remove('hint-sq','wrong-sq'));

  if (sq === quizState.expectedTo) {
    quizState.score++;
    applyMove(move);
    currentMoveIdx = quizState.quizMoveIdx;
    renderBoard(move.from, move.to);
    renderNotation();
    updateControls();
    showQuizFeedback(true, move);
  } else {
    document.getElementById(`sq-${sq}`)?.classList.add('wrong-sq');
    showQuizFeedback(false, move);
  }
}

function showQuizFeedback(correct, move) {
  const panel = document.getElementById('info-panel');
  const feedbackEl = panel.querySelector('.quiz-feedback');
  if (!feedbackEl) return;

  feedbackEl.className = `quiz-feedback ${correct ? 'correct' : 'wrong'}`;
  feedbackEl.innerHTML = correct
    ? `<div class="quiz-verdict">✓ Correct!</div>
       <div class="quiz-explanation">${move.explanation}</div>`
    : `<div class="quiz-verdict">✗ Not quite</div>
       <div class="quiz-explanation">The move was <strong>${move.notation}</strong> — ${move.explanation}</div>`;

  const btn = panel.querySelector('.quiz-btn');
  if (btn) {
    btn.disabled = false;
    btn.textContent = 'Next move →';
    btn.classList.add('ready');
  }

  feedbackEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderQuizPanel() {
  const move = currentOpening.moves[quizState.quizMoveIdx] || {};
  const who = move.who || 'white';
  const panel = document.getElementById('info-panel');
  panel.innerHTML = `
    <div class="opening-title fade-in">${currentOpening.name}</div>
    <div class="score-display">Score: ${quizState.score} / ${quizState.total}</div>
    <hr class="divider">
    <div class="quiz-prompt fade-in">
      <strong>Your turn</strong>
      ${who === 'white' ? '⬜' : '⬛'} ${who.charAt(0).toUpperCase()+who.slice(1)} to move.
      Click the highlighted piece's destination square.
    </div>
    <div class="quiz-feedback"></div>
    <button class="quiz-btn" onclick="advanceQuiz()" disabled>Next move →</button>
    <button class="quiz-btn" style="background:transparent;border:1px solid var(--border);color:var(--muted);margin-top:6px" onclick="startQuiz()">Restart quiz</button>
  `;
}

function advanceQuiz() {
  const panel = document.getElementById('info-panel');
  const btn = panel.querySelector('.quiz-btn');
  if (btn) btn.disabled = true;

  // If they were wrong, apply the correct move now to keep board in sync
  const move = currentOpening.moves[quizState.quizMoveIdx];
  if (currentMoveIdx < quizState.quizMoveIdx) {
    applyMove(move);
    currentMoveIdx = quizState.quizMoveIdx;
    renderBoard(move.from, move.to);
    renderNotation();
    updateControls();
  }

  quizState.quizMoveIdx++;
  promptNextQuizMove();
}

function renderQuizComplete() {
  saveProgress(currentOpening.id, quizState.score, quizState.total);
  const panel = document.getElementById('info-panel');
  const pct = quizState.total > 0 ? Math.round(quizState.score/quizState.total*100) : 0;
  panel.innerHTML = `
    <div class="opening-title fade-in">Quiz complete!</div>
    <div class="score-display" style="font-size:2rem;color:var(--gold);padding:1rem 0">${quizState.score}/${quizState.total}</div>
    <p class="opening-desc">${pct >= 80 ? 'Excellent! You know this opening well.' : pct >= 50 ? 'Good effort — review the moves you missed.' : 'Keep studying — browse mode can help you internalize the ideas.'}</p>
    <button class="quiz-btn" onclick="startQuiz()" style="margin-top:1rem">Try again</button>
    <button class="quiz-btn" style="background:transparent;border:1px solid var(--border);color:var(--muted);margin-top:6px" onclick="setMode('browse')">Back to browse</button>
  `;
}

// ── MODE ──────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.mode-btn[onclick="setMode('${m}')"]`).classList.add('active');

  if (m === 'quiz') {
    document.getElementById('btn-prev').style.visibility = 'hidden';
    document.getElementById('btn-next').style.visibility = 'hidden';
    startQuiz();
  } else {
    document.getElementById('btn-prev').style.visibility = '';
    document.getElementById('btn-next').style.visibility = '';
    loadOpening(currentOpening);
  }
}

init();
</script>
</body>
</html>
